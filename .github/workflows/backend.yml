# Backend Deployment Workflow - Python / FastAPI
name: Backend Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: ${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}
      APP_SERVICE_NAME: ${{ secrets.TF_VAR_BACKEND_APP_NAME }}

    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      # Backend source lives in its own repo (DOJO2026/Backend_Python_API,
      # FastAPI) - cloned here into ./backend-src, same clone-based pattern
      # as before. No token needed if the repo is public; if it's private,
      # add a `token:` here pointing at a PAT secret.
      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: DOJO2026/Backend_Python_API
          path: backend-src

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Resource Group
        run: az group show --name "$RESOURCE_GROUP"

      - name: Validate App Service
        run: az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_NAME"

      - name: Validate App Service Plan
        run: az appservice plan list --resource-group "$RESOURCE_GROUP" --output table

      - name: Start App Service If Needed
        shell: bash
        run: |
          STATE=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_NAME" --query state -o tsv)
          if [ "$STATE" != "Running" ]; then
            az webapp start --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_NAME"
          fi

      # FastAPI is just an ASGI app - nothing runs it unless we tell Azure
      # how. requirements.txt only has uvicorn (no gunicorn), so this runs
      # uvicorn directly. Fine for a dev/demo workload; swap for
      # gunicorn -k uvicorn.workers.UvicornWorker later if you need
      # multiple workers. Idempotent - safe to run on every deploy.
      - name: Configure Startup Command
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --startup-file "uvicorn main:app --host 0.0.0.0 --port 8000"

      # AZURE_OAI_*, AZURE_SEARCH_*, AZURE_SQL_*, AZURE_STORAGE_* and
      # SCM_DO_BUILD_DURING_DEPLOYMENT are NOT set here - they're set by
      # infra.yml, straight from Terraform outputs into APP_SETTINGS in
      # backend/terragrunt.hcl. This step just confirms they actually
      # landed before we deploy code on top of them.
      - name: Verify App Settings
        run: az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_NAME" --output table

      - name: Verify requirements.txt
        run: test -f backend-src/requirements.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyodbc/aioodbc need the unixODBC headers to build their C
      # extension wheel.
      - name: Install ODBC Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      # Build the virtualenv HERE, in the Actions runner (plenty of
      # RAM/CPU), instead of letting Azure's Oryx build it remotely on the
      # App Service's own B1 plan. B1 is the smallest/cheapest SKU, and the
      # remote Oryx build was dying silently partway through the install
      # (no antenv, no __oryx_packages__ ever got created - "uvicorn: not
      # found" at startup) - consistent with an out-of-memory kill while
      # installing the heavier packages (sqlalchemy, pyodbc, openai,
      # azure-storage-blob...). Building a venv named "antenv" and shipping
      # it pre-built sidesteps that entirely: Oryx's generated startup.sh on
      # the App Service side auto-detects and activates any folder named
      # exactly "antenv", so no remote build happens at all
      # (SCM_DO_BUILD_DURING_DEPLOYMENT is now "false" in Terraform).
      - name: Build Virtual Environment
        working-directory: backend-src
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Deployment ZIP
        working-directory: backend-src
        run: |
          zip -r ../backend.zip . \
            -x ".git/*" ".github/*" ".devcontainer/*" ".env" "__pycache__/*" "*.pyc"

      - name: Verify ZIP
        run: ls -lh backend.zip

      - name: Deploy Backend
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --src-path backend.zip \
            --type zip

      - name: Restart App Service
        run: az webapp restart --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_NAME"

      - name: Wait Startup
        run: sleep 60

      # FastAPI always serves /openapi.json once the app object imports
      # successfully, regardless of which routes main.py defines - a
      # reliable health check that doesn't depend on knowing the real
      # endpoint names yet.
      - name: Validate FastAPI is Up
        run: curl --retry 10 --retry-delay 10 --fail https://${{ secrets.TF_VAR_BACKEND_APP_NAME }}.azurewebsites.net/openapi.json

      - name: Deployment Summary
        run: |
          echo "=================================="
          echo "Backend Deployment Completed (Backend_Python_API / FastAPI)"
          echo "Resource Group: $RESOURCE_GROUP"
          echo "App Service: $APP_SERVICE_NAME"
          echo "Docs: https://${{ secrets.TF_VAR_BACKEND_APP_NAME }}.azurewebsites.net/docs"
          echo "=================================="
