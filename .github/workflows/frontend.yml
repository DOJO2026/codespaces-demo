name: Frontend Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  frontend:

    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: ${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}
      APP_SERVICE_NAME: ${{ secrets.TF_VAR_FRONTEND_APP_NAME }}
      BACKEND_APP_NAME: ${{ secrets.TF_VAR_BACKEND_APP_NAME }}

    steps:

      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      # Frontend source now lives in its own repo (DOJO2026/frontend,
      # public) - cloned here into ./frontend-src rather than read from a
      # local folder. No token needed since the repo is public.
      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          repository: DOJO2026/frontend
          path: frontend-src

      ####################################################
      # Azure Login
      ####################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ####################################################
      # Validate Resource Group
      ####################################################

      - name: Validate Resource Group
        run: |
          az group show \
            --name "$RESOURCE_GROUP"

      ####################################################
      # Validate App Service
      ####################################################

      - name: Validate Frontend App Service
        run: |
          az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME"

      ####################################################
      # Start App Service
      ####################################################

      - name: Start App Service
        shell: bash
        run: |

          STATE=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --query state \
            -o tsv)

          if [ "$STATE" != "Running" ]; then

            az webapp start \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_SERVICE_NAME"

          fi

      ####################################################
      # Configure Startup Command
      ####################################################

      # A Vite/React build is just static files (dist/), not a Node server -
      # without an explicit startup command, the Linux Node runtime has
      # nothing to run and the site sits on the default "waiting for
      # content" page forever, even after a perfectly successful deploy.
      # `pm2 serve` ships built into the Azure App Service Node image, so
      # this needs no extra dependency - it just serves /home/site/wwwroot
      # as static files, with --spa enabling client-side routing fallback
      # to index.html. Idempotent - safe to run on every deploy.
      - name: Configure Startup Command
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --startup-file "pm2 serve /home/site/wwwroot --no-daemon --spa"

      ####################################################
      # Node
      ####################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json

      ####################################################
      # Install
      ####################################################

      - name: Install Dependencies
        working-directory: frontend-src
        run: npm install

      ####################################################
      # Generate Production Environment
      ####################################################

      - name: Generate .env.production
        working-directory: frontend-src
        run: |

          echo "VITE_API_URL=https://${BACKEND_APP_NAME}.azurewebsites.net" > .env.production

          cat .env.production

      ####################################################
      # Build
      ####################################################

      - name: Build React
        working-directory: frontend-src
        run: npm run build

      ####################################################
      # Verify Dist
      ####################################################

      - name: Verify Dist Folder
        run: |

          ls -lah frontend-src/dist

      ####################################################
      # Create ZIP
      ####################################################

      - name: Create Deployment ZIP

        working-directory: frontend-src/dist

        run: |

          zip -r ../../frontend.zip .

      ####################################################
      # Verify ZIP
      ####################################################

      - name: Verify ZIP

        run: |

          ls -lh frontend.zip

      ####################################################
      # Deploy using Azure CLI
      ####################################################

      - name: Deploy Frontend

        run: |

          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --src-path frontend.zip \
            --type zip

      ####################################################
      # Restart App Service
      ####################################################

      - name: Restart App Service

        run: |

          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME"

      ####################################################
      # Wait
      ####################################################

      - name: Wait

        run: sleep 60

      ####################################################
      # Validate
      ####################################################

      - name: Validate Frontend

        run: |

          curl --retry 10 \
               --retry-delay 10 \
               --retry-all-errors \
               --fail \
               https://${{ secrets.TF_VAR_FRONTEND_APP_NAME }}.azurewebsites.net

      ####################################################
      # Summary
      ####################################################

      - name: Deployment Summary

        run: |

          echo "========================================"
          echo "Frontend Deployment Completed"
          echo "Resource Group : $RESOURCE_GROUP"
          echo "App Service    : $APP_SERVICE_NAME"
          echo "Backend URL    : https://${BACKEND_APP_NAME}.azurewebsites.net"
          echo "========================================"

# NOTE on auto-triggering from the frontend repo:
# A push to DOJO2026/frontend cannot trigger a workflow that lives in
# codespaces-demo via the normal `on: push:` mechanism - GitHub only
# watches the repo the workflow file is in. Two options if you want that:
#   1. Keep it manual: click "Run workflow" here after pushing to frontend.
#   2. Add a tiny workflow INSIDE the frontend repo that, on push to main,
#      calls `gh workflow run frontend.yml --repo DOJO2026/codespaces-demo`
#      (needs a PAT with `repo` + `workflow` scope on codespaces-demo,
#      stored as a secret in the frontend repo - this is the one piece that
#      can't avoid a cross-repo credential, since GITHUB_TOKEN can't
#      trigger workflows in a different repo). Same pattern as backend.yml.