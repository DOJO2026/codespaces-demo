name: Frontend Deployment

# Manual only - no push trigger. The frontend source lives in its own repo
# (DOJO2026/FRONT_V2), so there's nothing in THIS repo for a push trigger to
# watch. Deploy explicitly with "Run workflow" after pushing there.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  frontend:

    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: ${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}
      APP_SERVICE_NAME: ${{ secrets.TF_VAR_FRONTEND_APP_NAME }}
      BACKEND_APP_NAME: ${{ secrets.TF_VAR_BACKEND_APP_NAME }}

    steps:

      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      # Frontend source now lives in its own repo (DOJO2026/FRONT_V2,
      # Angular 20) - cloned here into ./frontend-src rather than read from
      # a local folder. No token needed since the repo is public.
      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          repository: DOJO2026/FRONT_V2
          path: frontend-src

      ####################################################
      # Azure Login
      ####################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ####################################################
      # Validate Resource Group
      ####################################################

      - name: Validate Resource Group
        run: |
          az group show \
            --name "$RESOURCE_GROUP"

      ####################################################
      # Validate App Service
      ####################################################

      - name: Validate Frontend App Service
        run: |
          az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME"

      ####################################################
      # Start App Service
      ####################################################

      - name: Start App Service
        shell: bash
        run: |

          STATE=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --query state \
            -o tsv)

          if [ "$STATE" != "Running" ]; then

            az webapp start \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_SERVICE_NAME"

          fi

      ####################################################
      # Configure Startup Command
      ####################################################

      # Same as before: an Angular production build is just static files
      # (dist/front-v2/browser), not a Node server - pm2 serve ships built
      # into the Azure Node runtime image and needs no extra dependency.
      # --spa enables client-side routing fallback to index.html.
      # Idempotent - safe to run on every deploy.
      - name: Configure Startup Command
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --startup-file "pm2 serve /home/site/wwwroot --no-daemon --spa"

      ####################################################
      # Node
      ####################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json

      ####################################################
      # Install
      ####################################################

      - name: Install Dependencies
        working-directory: frontend-src
        run: npm install

      ####################################################
      # Inject Backend URL
      ####################################################

      # Angular has no .env mechanism like Vite - the equivalent is
      # fileReplacements in angular.json, which swaps
      # src/environments/environment.ts for environment.prod.ts on a
      # "production" build. environment.prod.ts ships with a placeholder
      # (__API_BASE_URL__) committed in the repo; this step swaps that
      # placeholder for the real backend URL right before building, so the
      # real URL is never hardcoded in the repo itself. Requires the two
      # environment files + the fileReplacements entry in angular.json to
      # already exist in the frontend repo (see chat for the exact content).
      - name: Inject Backend URL
        working-directory: frontend-src
        run: |
          sed -i "s|__API_BASE_URL__|https://${BACKEND_APP_NAME}.azurewebsites.net|g" src/environments/environment.prod.ts
          cat src/environments/environment.prod.ts

      ####################################################
      # Build
      ####################################################

      # "npm run build" -> "ng build", which uses the "production"
      # configuration by default (defaultConfiguration in angular.json) -
      # that's the configuration that applies the fileReplacements above.
      - name: Build Angular
        working-directory: frontend-src
        run: npm run build

      ####################################################
      # Verify Dist
      ####################################################

      # Angular's newer esbuild-based builder (@angular/build:application)
      # outputs to dist/<project-name>/browser (adds the "browser"
      # subfolder even without SSR) instead of dist/<project-name> directly.
      # Project name here is "front-v2" (from angular.json).
      - name: Verify Dist Folder
        run: |

          ls -lah frontend-src/dist/front-v2/browser

      ####################################################
      # Create ZIP
      ####################################################

      - name: Create Deployment ZIP

        working-directory: frontend-src/dist/front-v2/browser

        run: |

          zip -r ../../../../frontend.zip .

      ####################################################
      # Verify ZIP
      ####################################################

      - name: Verify ZIP

        run: |

          ls -lh frontend.zip

      ####################################################
      # Deploy using Azure CLI
      ####################################################

      - name: Deploy Frontend

        run: |

          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --src-path frontend.zip \
            --type zip

      ####################################################
      # Restart App Service
      ####################################################

      - name: Restart App Service

        run: |

          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME"

      ####################################################
      # Wait
      ####################################################

      - name: Wait

        run: sleep 60

      ####################################################
      # Validate
      ####################################################

      - name: Validate Frontend

        run: |

          curl --retry 10 \
               --retry-delay 10 \
               --retry-all-errors \
               --fail \
               https://${{ secrets.TF_VAR_FRONTEND_APP_NAME }}.azurewebsites.net

      ####################################################
      # Summary
      ####################################################

      - name: Deployment Summary

        run: |

          echo "========================================"
          echo "Frontend Deployment Completed (FRONT_V2 / Angular)"
          echo "Resource Group : $RESOURCE_GROUP"
          echo "App Service    : $APP_SERVICE_NAME"
          echo "Backend URL    : https://${BACKEND_APP_NAME}.azurewebsites.net"
          echo "========================================"