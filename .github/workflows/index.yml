name: Index Search Documents

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  index:

    runs-on: ubuntu-latest

    env:
      AZURE_SEARCH_INDEX: "docs-index"
      AZURE_OAI_EMBEDDING_DEPLOYMENT: "embedding-deployment"

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Fetch Azure OpenAI and Search Credentials

      run: |
        OAI_ENDPOINT=$(az cognitiveservices account show \
          --name "${{ secrets.TF_VAR_OPENAI_ACCOUNT_NAME }}" \
          --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
          --query properties.endpoint -o tsv)

        OAI_KEY=$(az cognitiveservices account keys list \
          --name "${{ secrets.TF_VAR_OPENAI_ACCOUNT_NAME }}" \
          --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
          --query key1 -o tsv)

        SEARCH_ENDPOINT="https://${{ secrets.TF_VAR_SEARCH_SERVICE_NAME }}.search.windows.net"

        SEARCH_KEY=$(az search admin-key show \
          --service-name "${{ secrets.TF_VAR_SEARCH_SERVICE_NAME }}" \
          --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
          --query primaryKey -o tsv)

        echo "::add-mask::$OAI_KEY"
        echo "::add-mask::$SEARCH_KEY"

        echo "AZURE_OAI_ENDPOINT=$OAI_ENDPOINT" >> "$GITHUB_ENV"
        echo "AZURE_OAI_KEY=$OAI_KEY" >> "$GITHUB_ENV"
        echo "AZURE_SEARCH_ENDPOINT=$SEARCH_ENDPOINT" >> "$GITHUB_ENV"
        echo "AZURE_SEARCH_KEY=$SEARCH_KEY" >> "$GITHUB_ENV"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: pip install openai requests

    - name: Run Indexing Script
      run: python scripts/index_documents.py

    - name: Upload Source PDFs to Blob Storage

      # GET /api/v1/fuentes (en el backend) lista los documentos leyendo
      # directamente los blobs de este contenedor junto con sus metadatos -
      # es un endpoint separado del indice de busqueda de arriba, por eso
      # hay que subir los PDF reales aqui tambien.
      run: |
        STORAGE_CONN=$(az storage account show-connection-string \
          --name "${{ secrets.TF_VAR_STORAGE_ACCOUNT_NAME }}" \
          --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
          --query connectionString -o tsv)

        az storage blob upload \
          --connection-string "$STORAGE_CONN" \
          --container-name "contenedor" \
          --name "cjavaperu_com.pdf" \
          --file "data/search-docs/pdfs/cjavaperu_com.pdf" \
          --metadata category="Microservicios" chunks=34 embeddingModel="embedding-deployment" description="Articulo: Implementacion de microservicios con Quarkus y MicroProfile (cjavaperu.com)" \
          --overwrite

        az storage blob upload \
          --connection-string "$STORAGE_CONN" \
          --container-name "contenedor" \
          --name "www_altiacompany.pdf" \
          --file "data/search-docs/pdfs/www_altiacompany.pdf" \
          --metadata category="Microservicios" chunks=13 embeddingModel="embedding-deployment" description="Articulo de Altia sobre Quarkus (Inspiring Technology)" \
          --overwrite
