name: Database Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  database:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # AZURE LOGIN
      ############################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ############################################################
      # VERIFY SQL SERVER
      ############################################################

      - name: Verify SQL Server Exists
        run: |

          echo "Verificando SQL Server..."

          az sql server show \
            --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
            --name "${{ secrets.TF_VAR_SQL_SERVER_NAME }}"

      ############################################################
      # VERIFY DATABASE
      ############################################################

      - name: Verify Database Exists
        run: |

          echo "Verificando Base de Datos..."

          az sql db show \
            --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
            --server "${{ secrets.TF_VAR_SQL_SERVER_NAME }}" \
            --name "${{ secrets.TF_VAR_DATABASE_NAME }}"

      ############################################################
      # INSTALL SQLCMD
      ############################################################

      - name: Install SQLCMD
        run: |

          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/msprod.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            mssql-tools18 \
            unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      ############################################################
      # GET RUNNER IP
      ############################################################

      - name: Get Runner Public IP
        id: runner
        run: |

          IP=$(curl -s https://api.ipify.org)

          echo "Runner IP: $IP"

          echo "ip=$IP" >> $GITHUB_OUTPUT

      ############################################################
      # CHECK FIREWALL
      ############################################################

      - name: Check Firewall Rule
        id: firewall
        shell: bash

        run: |

          EXISTS=$(az sql server firewall-rule list \
            --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
            --server "${{ secrets.TF_VAR_SQL_SERVER_NAME }}" \
            --query "[?startIpAddress=='${{ steps.runner.outputs.ip }}'] | length(@)" \
            -o tsv)

          echo "exists=$EXISTS" >> $GITHUB_OUTPUT

          echo "Firewall Exists: $EXISTS"

      ############################################################
      # CREATE FIREWALL RULE ONLY IF NEEDED
      ############################################################

      - name: Create Firewall Rule

        if: steps.firewall.outputs.exists == '0'

        run: |

          echo "Creando regla temporal..."

          az sql server firewall-rule create \
            --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
            --server "${{ secrets.TF_VAR_SQL_SERVER_NAME }}" \
            --name github-runner-${{ github.run_id }} \
            --start-ip-address "${{ steps.runner.outputs.ip }}" \
            --end-ip-address "${{ steps.runner.outputs.ip }}"

      ############################################################
      # WAIT ONLY IF CREATED
      ############################################################

      - name: Wait Firewall

        if: steps.firewall.outputs.exists == '0'

        run: |

          echo "Esperando propagación..."

          sleep 20

      ############################################################
      # EXECUTE SCHEMA
      ############################################################

      - name: Execute schema.sql

        run: |

          sqlcmd \
            -S "${{ secrets.TF_VAR_SQL_SERVER_NAME }}.database.windows.net" \
            -d "${{ secrets.TF_VAR_DATABASE_NAME }}" \
            -U "${{ secrets.TF_VAR_SQL_ADMIN_LOGIN }}" \
            -P "${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}" \
            -C \
            -i database/schema.sql

      ############################################################
      # EXECUTE DATA
      ############################################################

      - name: Execute data.sql

        run: |

          sqlcmd \
            -S "${{ secrets.TF_VAR_SQL_SERVER_NAME }}.database.windows.net" \
            -d "${{ secrets.TF_VAR_DATABASE_NAME }}" \
            -U "${{ secrets.TF_VAR_SQL_ADMIN_LOGIN }}" \
            -P "${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}" \
            -C \
            -i database/data.sql

      ############################################################
      # VALIDATE DATABASE
      ############################################################

      - name: Validate Database

        run: |

          sqlcmd \
            -S "${{ secrets.TF_VAR_SQL_SERVER_NAME }}.database.windows.net" \
            -d "${{ secrets.TF_VAR_DATABASE_NAME }}" \
            -U "${{ secrets.TF_VAR_SQL_ADMIN_LOGIN }}" \
            -P "${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}" \
            -C \
            -Q "SELECT COUNT(*) AS TotalClientes FROM clientes"

      ############################################################
      # REMOVE TEMPORARY FIREWALL RULE
      ############################################################

      - name: Remove Firewall Rule

        if: always() && steps.firewall.outputs.exists == '0'

        run: |

          echo "Eliminando regla temporal..."

          az sql server firewall-rule delete \
            --resource-group "${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}" \
            --server "${{ secrets.TF_VAR_SQL_SERVER_NAME }}" \
            --name github-runner-${{ github.run_id }} \
            --yes

      ############################################################
      # FINISHED
      ############################################################

      - name: Finished

        run: |

          echo "======================================"

          echo "Database Deployment Completed"

          echo "======================================"